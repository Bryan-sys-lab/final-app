name: Flutter app

on:
  push:
    branches: [main, final-app]
    paths:
      - "flutter/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "flutter/**"
      - ".github/workflows/flutter.yml"
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  # The release build fails closed without this: a release with no pin
  # material would connect to the API over public roots.
  RELEASE_PINS: ${{ secrets.HELIX_PINNED_CERT_SHA256 }}

jobs:
  verify:
    name: Analyze, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4

      # AGP 8.12 needs JDK 17. The runner's default JDK moves, and a newer
      # JDK fails the build with an unhelpful Gradle error.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build Android (debug APK)
        run: |
          flutter build apk --debug \
            --dart-define=MAP_TILE_URL="${{ secrets.HELIX_MAP_TILE_URL || 'https://tile.openstreetmap.org/{z}/{x}/{y}.png' }}"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: helix-android-apk
          path: flutter/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          {
            echo "### Flutter app" >> "$GITHUB_STEP_SUMMARY"
            echo "- analyze: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- artifact: \`helix-android-apk\` (debug APK)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          } >> "$GITHUB_STEP_SUMMARY"



  demo:
    name: Demo build (no backend)
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    env:
      HELIX_KEYSTORE_BASE64: ${{ secrets.HELIX_KEYSTORE_BASE64 }}
      HELIX_KEYSTORE_PASSWORD: ${{ secrets.HELIX_KEYSTORE_PASSWORD }}
      HELIX_KEY_ALIAS: ${{ secrets.HELIX_KEY_ALIAS }}
      HELIX_KEY_PASSWORD: ${{ secrets.HELIX_KEY_PASSWORD }}
      HELIX_PINNED_CERT_SHA256: ${{ secrets.HELIX_PINNED_CERT_SHA256 }}
      HELIX_API_CA_PEM: ${{ secrets.HELIX_API_CA_PEM }}
      HELIX_MAP_TILE_URL: ${{ secrets.HELIX_MAP_TILE_URL || 'https://tile.openstreetmap.org/{z}/{x}/{y}.png' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Assemble the signing material
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/helix-signing"
          printf '%s' "$HELIX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/helix-signing/helix-release.p12"
          cat > "$RUNNER_TEMP/helix-signing/key.properties" <<EOF
          storeFile=helix-release.p12
          storePassword=$HELIX_KEYSTORE_PASSWORD
          keyAlias=$HELIX_KEY_ALIAS
          keyPassword=$HELIX_KEY_PASSWORD
          EOF
          echo "HELIX_KEYSTORE_PROPERTIES=$RUNNER_TEMP/helix-signing/key.properties" >> "$GITHUB_ENV"

      - name: Install the pinned CA
        run: |
          set -euo pipefail
          mkdir -p assets/pins
          printf '%s' "$HELIX_API_CA_PEM" > assets/pins/api-ca.pem

      - name: Build demo APK (signed, in-process mock backend)
        run: |
          flutter build apk --release \
            --dart-define=DEMO_MODE=true \
            --dart-define=PINNED_CERT_SHA256="$HELIX_PINNED_CERT_SHA256" \
            --dart-define=REQUIRE_PINNING=true \
            --dart-define=MAP_TILE_URL="$HELIX_MAP_TILE_URL"
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/helix-demo.apk

      - name: Upload demo APK
        uses: actions/upload-artifact@v4
        with:
          name: helix-android-demo-apk
          path: /tmp/helix-demo.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Signed release bundle
    # A release bundle is produced from the integration branch and from tags.
    needs: verify
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    env:
      # The tile source. The OpenStreetMap public tiles are the default and
      # need no key; a deployment with its own provider sets this.
      HELIX_MAP_TILE_URL: ${{ secrets.HELIX_MAP_TILE_URL || 'https://tile.openstreetmap.org/{z}/{x}/{y}.png' }}
      HELIX_KEYSTORE_BASE64: ${{ secrets.HELIX_KEYSTORE_BASE64 }}
      HELIX_KEYSTORE_PASSWORD: ${{ secrets.HELIX_KEYSTORE_PASSWORD }}
      HELIX_KEY_ALIAS: ${{ secrets.HELIX_KEY_ALIAS }}
      HELIX_KEY_PASSWORD: ${{ secrets.HELIX_KEY_PASSWORD }}
      HELIX_PINNED_CERT_SHA256: ${{ secrets.HELIX_PINNED_CERT_SHA256 }}
      HELIX_API_CA_PEM: ${{ secrets.HELIX_API_CA_PEM }}
      HELIX_RELEASE_CERT_SHA256: ${{ secrets.HELIX_RELEASE_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Fail closed without the release secrets
        run: |
          set -euo pipefail
          missing=0
          for secret in HELIX_KEYSTORE_BASE64 HELIX_KEYSTORE_PASSWORD HELIX_KEY_ALIAS HELIX_KEY_PASSWORD HELIX_PINNED_CERT_SHA256 HELIX_API_CA_PEM; do
            if [ -z "${!secret:-}" ]; then
              echo "::error::missing secret $secret — a release build refuses to run without it"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Assemble the signing material
        # The keystore never enters the repository: it is written to the
        # runner's temporary directory and referenced by path.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/helix-signing"
          printf '%s' "$HELIX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/helix-signing/helix-release.p12"
          cat > "$RUNNER_TEMP/helix-signing/key.properties" <<EOF
          storeFile=helix-release.p12
          storePassword=$HELIX_KEYSTORE_PASSWORD
          keyAlias=$HELIX_KEY_ALIAS
          keyPassword=$HELIX_KEY_PASSWORD
          EOF
          echo "HELIX_KEYSTORE_PROPERTIES=$RUNNER_TEMP/helix-signing/key.properties" >> "$GITHUB_ENV"

      - name: Install the pinned CA
        # The client trusts this certificate and nothing else.
        run: |
          set -euo pipefail
          mkdir -p assets/pins
          printf '%s' "$HELIX_API_CA_PEM" > assets/pins/api-ca.pem

      - name: Build the signed bundle
        run: |
          flutter build appbundle --release \
            --dart-define=DEMO_MODE=true \
            --dart-define=PINNED_CERT_SHA256="$HELIX_PINNED_CERT_SHA256" \
            --dart-define=REQUIRE_PINNING=true \
            --dart-define=MAP_TILE_URL="$HELIX_MAP_TILE_URL"

      - name: Build the signed APK
        run: |
          flutter build apk --release \
            --dart-define=DEMO_MODE=true \
            --dart-define=PINNED_CERT_SHA256="$HELIX_PINNED_CERT_SHA256" \
            --dart-define=REQUIRE_PINNING=true \
            --dart-define=MAP_TILE_URL="$HELIX_MAP_TILE_URL"
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/helix-release.apk

      - name: Verify the signature
        run: |
          set -euo pipefail
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab \
            | grep -F "$HELIX_RELEASE_CERT_SHA256"

      - name: Upload the release bundle
        uses: actions/upload-artifact@v4
        with:
          name: helix-android-release-bundle
          path: flutter/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30


  tag-and-release:
    name: Tag and release
    needs: [verify, demo]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from pubspec
        id: version
        run: |
          cd flutter
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | tr -d ' ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Bump patch version
        run: |
          cd flutter
          python3 - <<'PY'
          import re
          p = 'pubspec.yaml'
          s = open(p).read()
          m = re.search(r'^version:\s*(\d+)\.(\d+)\.(\d+)\+(\d+)$', s, re.M)
          if not m: 
            print('no version match'); exit(0)
          major, minor, patch, build = m.groups()
          new = f"{major}.{minor}.{int(patch)+1}+{int(build)+1}"
          s = re.sub(r'^version:.*$', f'version: {new}', s, count=1, flags=re.M)
          open(p,'w').write(s)
          print('bumped to', new)
          PY

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flutter/pubspec.yaml
          git commit -m "chore: bump version [skip ci]" || echo "nothing to commit"
          git push

      - name: Create tag
        run: |
          cd flutter
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | tr -d ' ' | cut -d+ -f1)
          git tag "v$VERSION" || true
          git push origin "v$VERSION" || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build demo APK for release
        run: |
          cd flutter
          flutter pub get
          flutter build apk --debug --dart-define=DEMO_MODE=true
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/helix-release.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Helix v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: /tmp/helix-release.apk

      - name: Publish to Nerva
        env:
          CI_TOKEN: ${{ secrets.NERVA_CI_TOKEN }}
        run: |
          curl -fSs -X POST https://nerva.brianbmk332.workers.dev/api/releases \
            -H "x-ci-token: $CI_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"id\": \"helix\",
              \"version\": {
                \"version\": \"${{ steps.version.outputs.version }}\",
                \"url\": \"https://github.com/Bryan-sys-lab/final-app/releases/download/v${{ steps.version.outputs.version }}/helix-demo.apk\",
                \"channel\": \"beta\"
              }
            }" || true
